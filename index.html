<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16.png" />
  <link rel="manifest" href="./manifest.json" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#050505" />
  <meta name="description" content="Professional Hypertrophy Tracker with RP-style progression, analytics, and offline support." />

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="GainsLab" />
  <meta name="application-name" content="GainsLab" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="msapplication-TileColor" content="#050505" />
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />

  <link rel="preload" href="./icon-192.png" as="image" type="image/png" />
  <link rel="preload" href="./assets/branding/logo-lockup.png" as="image" type="image/png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <title>GainsLab</title>

  <script>
    window.deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', (event) => {
      event.preventDefault();
      window.deferredPrompt = event;
      console.log('PWA install event captured globally');
    });
  </script>

  <script>
    window.onerror = function (message, source, lineno) {
      var msg = message + '\n' + source + ':' + lineno;
      console.error(msg);
      if (String(message).includes('ResizeObserver')) return;
      showError(msg);
    };

    setTimeout(function () {
      var root = document.getElementById('root');
      if (!root || root.innerHTML.trim() === '') {
        console.warn('React taking long to mount...');
        showError('Startup Timeout: App did not mount.\nCheck console for runtime errors.');
      }
    }, 15000);

    function showError(msg) {
      var box = document.getElementById('error-box');
      if (!box) {
        box = document.createElement('div');
        box.id = 'error-box';
        box.style.cssText = 'position:fixed; top:0; left:0; width:100%; height:100%; background:#09090b; color:#ef4444; z-index:99999; padding:20px; font-family:monospace; white-space:pre-wrap; overflow:auto;';
        document.body.appendChild(box);
        box.innerHTML = '<h2 style="margin-top:0">Application Error</h2>';
      }
      if (!box.innerHTML.includes(msg.substring(0, 20))) {
        box.innerHTML += '<div style="margin-top:10px; border-top:1px solid #333; padding-top:10px;">' + msg + '</div>';
      }
    }

    window.addEventListener('DOMContentLoaded', function () {
      var launchScreen = document.getElementById('pwa-launch-screen');
      var root = document.getElementById('root');
      if (!launchScreen || !root) return;

      var maybeHideLaunchScreen = function () {
        if (root.childElementCount > 0 || root.textContent.trim().length > 0) {
          launchScreen.classList.add('is-hidden');
          setTimeout(function () { launchScreen.remove(); }, 260);
          observer.disconnect();
        }
      };

      var observer = new MutationObserver(maybeHideLaunchScreen);
      observer.observe(root, { childList: true, subtree: true, characterData: true });
      maybeHideLaunchScreen();
    });
  </script>

  <style>
    :root {
      color-scheme: dark;
      background: #050505;
    }

    .glass {
      background-color: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(0, 0, 0, 0.05);
    }

    .dark .glass {
      background-color: rgba(24, 24, 27, 0.85);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .scroll-container::-webkit-scrollbar {
      width: 0;
      background: transparent;
    }

    body {
      margin: 0;
      background-color: #fafafa;
      color: #18181b;
    }

    .dark body {
      background-color: #09090b;
      color: #f4f4f5;
    }

    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    @keyframes slideUp {
      from {
        transform: translateY(100%);
        opacity: 0;
      }

      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .animate-slideUp {
      animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    #pwa-launch-screen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at top, rgba(200, 255, 0, 0.14), transparent 38%),
        #050505;
      transition: opacity 0.22s ease, visibility 0.22s ease;
    }

    #pwa-launch-screen.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .launch-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      padding: 32px 28px;
      border-radius: 32px;
      background: rgba(10, 10, 10, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.06);
      box-shadow: 0 32px 90px rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .launch-lockup {
      width: min(78vw, 420px);
      height: auto;
      object-fit: contain;
      filter: drop-shadow(0 0 28px rgba(200, 255, 0, 0.12));
    }

    .launch-subtitle {
      text-align: center;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: rgba(161, 161, 170, 0.92);
    }
  </style>
</head>

<body class="h-full w-full overflow-hidden select-none transition-colors duration-300">
  <div id="pwa-launch-screen" aria-hidden="true">
    <div class="launch-card">
      <img class="launch-lockup" src="./assets/branding/logo-lockup.png" alt="GainsLab" />
      <div class="launch-subtitle">Track. Test. Grow.</div>
    </div>
  </div>
  <div id="root" class="h-full w-full"></div>
  <script type="module" src="./index.tsx"></script>
</body>

</html>
