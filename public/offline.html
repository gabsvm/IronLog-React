<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GainsLab Offline</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at top, rgba(220, 38, 38, 0.14), transparent 40%),
          #050505;
        color: #f4f4f5;
        font-family: Inter, system-ui, sans-serif;
      }
      .card {
        width: min(420px, calc(100vw - 32px));
        padding: 28px 24px;
        border-radius: 24px;
        background: rgba(17, 17, 19, 0.96);
        border: 1px solid rgba(63, 63, 70, 0.9);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
      }
      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 10px;
        border-radius: 999px;
        background: rgba(39, 39, 42, 0.95);
        color: #a1a1aa;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: #f59e0b;
      }
      h1 {
        margin: 18px 0 10px;
        font-size: 34px;
        line-height: 0.95;
        letter-spacing: -0.05em;
      }
      p {
        margin: 0;
        color: #a1a1aa;
        line-height: 1.55;
        font-size: 14px;
      }
      .actions {
        display: flex;
        gap: 12px;
        margin-top: 22px;
      }
      a,
      button {
        appearance: none;
        border: 0;
        border-radius: 16px;
        padding: 12px 16px;
        font: inherit;
        font-weight: 700;
        text-decoration: none;
        cursor: pointer;
      }
      .primary {
        background: linear-gradient(135deg, #d9f747, #b2f12b);
        color: #09090b;
      }
      .secondary {
        background: #18181b;
        color: #f4f4f5;
        border: 1px solid #3f3f46;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="eyebrow"><span class="dot"></span> Offline Mode</div>
      <h1>GainsLab</h1>
      <p>
        No network available right now. Your local data is still on this device.
        Reconnect and the app will resume cloud sync automatically.
      </p>
      <div class="actions">
        <button class="primary" onclick="location.reload()">Try again</button>
        <a class="secondary" href="/">Open cached app</a>
      </div>
    </main>
  </body>
</html>
