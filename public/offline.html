<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050505" />
    <title>GainsLab Offline</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at top, rgba(200, 255, 0, 0.15), transparent 38%),
          #050505;
        color: #f4f4f5;
        font-family: Inter, system-ui, sans-serif;
      }
      .card {
        width: min(420px, calc(100vw - 32px));
        padding: 32px 24px 26px;
        border-radius: 28px;
        background: rgba(10, 10, 10, 0.92);
        border: 1px solid rgba(255, 255, 255, 0.06);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
        text-align: center;
      }
      .mark {
        width: 88px;
        height: 88px;
        object-fit: contain;
        filter: drop-shadow(0 0 18px rgba(200, 255, 0, 0.12));
      }
      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-top: 18px;
        padding: 6px 10px;
        border-radius: 999px;
        background: rgba(39, 39, 42, 0.95);
        color: #a1a1aa;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: #c8ff00;
      }
      h1 {
        margin: 18px 0 8px;
        font-size: 38px;
        line-height: 0.92;
        letter-spacing: -0.06em;
      }
      .accent {
        color: #c8ff00;
      }
      p {
        margin: 0;
        color: #a1a1aa;
        line-height: 1.55;
        font-size: 14px;
      }
      .actions {
        display: flex;
        gap: 12px;
        margin-top: 24px;
      }
      a,
      button {
        appearance: none;
        border: 0;
        border-radius: 16px;
        padding: 12px 16px;
        font: inherit;
        font-weight: 700;
        text-decoration: none;
        cursor: pointer;
      }
      .primary {
        background: linear-gradient(135deg, #d9f747, #b2f12b);
        color: #09090b;
      }
      .secondary {
        background: #18181b;
        color: #f4f4f5;
        border: 1px solid #3f3f46;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img class="mark" src="/assets/branding/logo-mark.png" alt="" />
      <div class="eyebrow"><span class="dot"></span> Offline Mode</div>
      <h1>Gains<span class="accent">Lab</span></h1>
      <p>
        No network available right now. Your local data is still on this device.
        Reconnect and the app will resume cloud sync automatically.
      </p>
      <div class="actions">
        <button class="primary" onclick="location.reload()">Try again</button>
        <a class="secondary" href="/">Open cached app</a>
      </div>
    </main>
  </body>
</html>
