apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

Properties localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}

def releaseKeystorePath = System.getenv('GAINS_LAB_KEYSTORE_PATH') ?: localProperties.getProperty('gainslab.keystore.path') ?: (project.findProperty('GAINS_LAB_KEYSTORE_PATH') ?: 'C:/Users/Gabriel Sanchez/.android/gainslab-release.keystore')
def releaseKeystorePassword = System.getenv('GAINS_LAB_KEYSTORE_PASSWORD') ?: localProperties.getProperty('gainslab.keystore.password') ?: (project.findProperty('GAINS_LAB_KEYSTORE_PASSWORD') ?: 'Ambar07!')
def releaseKeyAlias = System.getenv('GAINS_LAB_KEY_ALIAS') ?: localProperties.getProperty('gainslab.key.alias') ?: (project.findProperty('GAINS_LAB_KEY_ALIAS') ?: 'gainslab')
def releaseKeyPassword = System.getenv('GAINS_LAB_KEY_PASSWORD') ?: localProperties.getProperty('gainslab.key.password') ?: (project.findProperty('GAINS_LAB_KEY_PASSWORD') ?: 'Ambar07!')
def releaseSigningConfigured = [
    releaseKeystorePath,
    releaseKeystorePassword,
    releaseKeyAlias,
    releaseKeyPassword,
].every { it != null && !it.trim().isEmpty() }
def releaseTaskRequested = gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }

android {
    namespace = "com.gainslab.pro"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.gainslab.pro"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Keep this above the previously published GainsLab APK (413) so
        // testers can update it in place without uninstalling first.
        versionCode 435
        versionName "4.0.3-kong.28"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (releaseSigningConfigured) {
                storeFile file(releaseKeystorePath)
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
        debug {
            if (releaseSigningConfigured) {
                storeFile file(releaseKeystorePath)
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            if (releaseTaskRequested && !releaseSigningConfigured) {
                throw new GradleException('GainsLab release signing is not configured. Set GAINS_LAB_KEYSTORE_PATH, GAINS_LAB_KEYSTORE_PASSWORD, GAINS_LAB_KEY_ALIAS, and GAINS_LAB_KEY_PASSWORD.')
            }
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = '21'
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // U9: Health Connect (weight import, workout export). minSdk 26 inside; guarded at runtime.
    implementation "androidx.health.connect:connect-client:$healthConnectVersion"
    // U10: Google Drive backup authorization (drive.appdata scope only).
    implementation "com.google.android.gms:play-services-auth:$playServicesAuthVersion"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
